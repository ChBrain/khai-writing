name: release

# Changesets-driven release for the khai-writing archive.
#
# On every push to main:
#   * If unreleased changeset files exist, the action opens/updates a
#     "Version Packages" PR that bumps the version and writes the CHANGELOG.
#     Merging that PR consumes the changesets (and rebuilds registry.json via
#     the `version` script, keeping the index in lockstep with the version).
#   * If there are no pending changesets, the action runs `changeset publish`,
#     which publishes @chbrain/khai-writing to GitHub Packages and pushes its tag.
#
# RELEASE_TOKEN must be a PAT with Contents: write and Pull requests: write.
# The built-in GITHUB_TOKEN cannot drive the git pushes here: GitHub suppresses
# workflow runs on commits made by GITHUB_TOKEN, so the Version PR would never
# get CI and could never be merged green.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"
          scope: "@chbrain"
          cache: "npm"

      - name: install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: test
        run: npm test

      - name: changesets release
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
